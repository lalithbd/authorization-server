spring:
  application:
    name: authorization.server
  datasource:
    url: jdbc:postgresql://localhost:5432/authServer
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: true
  session:
    store-type: jdbc
server:
  port: 8080
cors:
  allowed-origins: http://localhost:3000
auth:
  refresh-token:
    # Window after rotation in which the superseded token still returns the replacement pair,
    # covering clients that lost the response. Longer values are friendlier to flaky networks and
    # give an attacker a wider replay window. 0 disables the window entirely.
    rotation-grace-seconds: 15
    # Hard ceiling on how long one login can be extended by rotation. 30 days.
    absolute-lifetime-seconds: 2592000
logging.level:
  org:
    springframework:
      web: DEBUG
      security: DEBUG
      security.oauth2: DEBUG

    hibernate: INFO
  com.mcueen.auth: DEBUG